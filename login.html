<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NaiveUi</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui@2.44.1/dist/index.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 0%, #c3e7ff 0%, #f0f4ff 35%, #fff 55%, #e8d5f5 85%, #d4b8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.3s;
    }
    body.dark {
      background: radial-gradient(ellipse at 20% 0%, #1a2744 0%, #1e293b 35%, #1a1a2e 55%, #2d1b4e 85%, #1a1025 100%);
    }
    .page-wrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
    }
    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      color: #555;
    }
    .theme-toggle:hover { background: rgba(0,0,0,0.1); }
    body.dark .theme-toggle {
      background: rgba(255,255,255,0.1);
      color: #ccc;
    }
    body.dark .theme-toggle:hover { background: rgba(255,255,255,0.15); }
    .lang-btn {
      height: 36px;
      border-radius: 18px;
      border: none;
      background: rgba(0,0,0,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 12px;
      transition: background 0.2s, color 0.2s;
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }
    .lang-btn:hover { background: rgba(0,0,0,0.1); }
    body.dark .lang-btn {
      background: rgba(255,255,255,0.1);
      color: #ccc;
    }
    body.dark .lang-btn:hover { background: rgba(255,255,255,0.15); }
    .login-card {
      width: 400px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
      padding: 32px 28px 28px;
      transition: background 0.3s, box-shadow 0.3s;
    }
    body.dark .login-card {
      background: #232736;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      transition: color 0.3s;
    }
    body.dark .card-title { color: #e0e0e0; }
    .card-title .wave { font-size: 18px; }
    .bottom-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 8px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .forgot-link {
      color: #999;
      text-decoration: none;
      transition: color 0.3s;
    }
    .forgot-link:hover { color: #666; }
    body.dark .forgot-link { color: #888; }
    body.dark .forgot-link:hover { color: #ccc; }
    .third-party-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      color: #bbb;
      font-size: 12px;
      transition: color 0.3s;
    }
    body.dark .third-party-divider { color: #666; }
    .third-party-divider::before,
    .third-party-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8e8;
      transition: background 0.3s;
    }
    body.dark .third-party-divider::before,
    body.dark .third-party-divider::after { background: #3a3f50; }
    .third-party-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .third-party-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #e8e8e8;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .third-party-btn:hover {
      border-color: #18a058;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    body.dark .third-party-btn {
      background: #2a2e3d;
      border-color: #3a3f50;
    }
    body.dark .third-party-btn:hover {
      border-color: #18a058;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .github-icon { fill: #333; transition: fill 0.3s; }
    body.dark .github-icon { fill: #e0e0e0; }
    .verify-code-input input { letter-spacing: 4px; }
    .verify-code-input input::placeholder { letter-spacing: normal; }
  </style>
</head>
<body>
<script type="text/html" id="login-template">
  <div class="page-wrapper">
    <!-- Header -->
    <div class="page-header">
      <button class="lang-btn" @click="handleLangClick" :title="t('selectLanguage')">
        <n-icon :size="16">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </n-icon>
        {{ locale === 'zh' ? t('langZh') : t('langEn') }}
      </button>
      <n-dropdown
        placement="bottom-end"
        :show="showLangMenu"
        :options="langOptions"
        :x="langMenuX"
        :y="langMenuY"
        @select="handleLangSelect"
        @clickoutside="showLangMenu = false"
      />
      <button class="theme-toggle" @click="toggleTheme" :title="theme === null ? t('toDark') : t('toLight')">
        <n-icon :size="18">
          <svg v-if="theme === null" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </n-icon>
      </button>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="card-title">{{ t('welcome') }} <span class="wave">👋</span></div>

      <!-- Tabs -->
      <n-tabs type="segment" size="small" v-model:value="activeTab" style="margin-bottom: 20px;">
        <n-tab-pane name="password" :tab="t('tabCode')"></n-tab-pane>
        <n-tab-pane name="qrcode" :tab="t('tabQR')"></n-tab-pane>
      </n-tabs>

      <!-- Password Form -->
      <template v-if="activeTab === 'password'">
        <!-- Phone -->
        <n-input
          v-model:value="phone"
          :placeholder="t('phonePlaceholder')"
          size="large"
          round
          class="verify-code-input"
          maxlength="11"
          style="margin-bottom: 12px;"
          @input="phone = phone.replace(/\D/g, '')"
        >
          <template #prefix>
            <n-icon :size="18" :color="theme ? '#888' : '#999'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
              </svg>
            </n-icon>
          </template>
        </n-input>

        <!-- Verify Code + Send Button -->
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <n-input
            v-model:value="verifyCode"
            :placeholder="t('codePlaceholder')"
            size="large"
            round
            class="verify-code-input"
            style="flex: 1;"
            maxlength="6"
            @input="verifyCode = verifyCode.replace(/\D/g, '')"
          >
            <template #prefix>
              <n-icon :size="18" :color="theme ? '#888' : '#999'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </n-icon>
            </template>
          </n-input>
          <n-button
            size="large"
            round
            style="white-space: nowrap; flex-shrink: 0; min-width: 110px;"
            :loading="isSending"
            :disabled="countdown > 0"
            @click="sendCode"
          >
            {{ countdown > 0 ? countdown + 's' : t('getCode') }}
          </n-button>
        </div>

        <!-- Password -->
        <n-input
          v-model:value="password"
          :type="showPassword ? 'text' : 'password'"
          :placeholder="t('passwordPlaceholder')"
          size="large"
          round
          style="margin-bottom: 20px;"
        >
          <template #prefix>
            <n-icon :size="18" :color="theme ? '#888' : '#999'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </n-icon>
          </template>
          <template #suffix>
            <n-icon :size="18" :color="theme ? '#888' : '#999'" style="cursor: pointer;" @click="showPassword = !showPassword">
              <svg v-if="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.04 18.04 0 0 1 .95-1.95"/><path d="M1 1l22 22"/><path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
              </svg>
            </n-icon>
          </template>
        </n-input>

        <!-- Login Button -->
        <n-button
          type="primary"
          size="large"
          block
          round
          :loading="isLoggingIn"
          :disabled="isLoggingIn"
          @click="handleLogin"
        >
          {{ t('login') }}
        </n-button>

        <!-- Bottom Links -->
        <div class="bottom-links">
          <a href="#" class="forgot-link">{{ t('forgotPassword') }}</a>
        </div>

        <!-- Third Party Login -->
        <div class="third-party-divider">{{ t('thirdPartyLogin') }}</div>
        <div class="third-party-icons">
          <!-- WeChat -->
          <button class="third-party-btn" :title="t('wechatLogin')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#07c160">
              <path d="M8.5 13.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM12 2C6.477 2 2 6.037 2 11c0 2.757 1.438 5.228 3.693 6.85L5 20l2.85-1.424C8.827 18.93 10.377 19.5 12 19.5c5.523 0 10-4.037 10-8.5S17.523 2 12 2z"/>
            </svg>
          </button>
          <!-- QQ -->
          <button class="third-party-btn" :title="t('qqLogin')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#12b7f5">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5v-1c-2.5-.5-4-2-4-4 0-1.5 1-3 2.5-3.5C9.5 7 10.5 6 12 6s2.5 1 2.5 3c1.5.5 2.5 2 2.5 3.5 0 2-1.5 3.5-4 4v1h-2z"/>
            </svg>
          </button>
          <!-- GitHub -->
          <button class="third-party-btn" :title="t('githubLogin')">
            <svg width="18" height="18" viewBox="0 0 24 24" class="github-icon">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
            </svg>
          </button>
        </div>
      </template>

      <!-- QR Code -->
      <div v-show="activeTab === 'qrcode'" style="text-align: center; padding: 20px 0;">
        <div
          style="position: relative; width: 180px; height: 180px; margin: 0 auto; border-radius: 8px; overflow: hidden; cursor: pointer;"
          @click="refreshQRCode"
          @mouseenter="showQROverlay = true"
          @mouseleave="showQROverlay = false"
        >
          <!-- QR Code SVG -->
          <svg id="qrcode-svg" width="180" height="180" viewBox="0 0 180 180">
            <rect width="180" height="180" fill="#fff"/>
          </svg>
          <!-- Hover Overlay -->
          <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: opacity 0.2s;"
               :style="{ opacity: showQROverlay ? 1 : 0 }">
            <span style="color: #fff; font-size: 13px; text-align: center; padding: 0 10px; line-height: 1.4;">{{ t('refreshQR') }}</span>
          </div>
        </div>
        <!-- Countdown Circle -->
        <div style="margin-top: 16px; display: flex; justify-content: center;">
          <n-progress
            type="circle"
            :percentage="percentage"
            :stroke-width="6"
             :gap-offset-degree="180"

            status="success"
            indicator-placement="inside"
            :indicator-text-color="theme ? '#ccc' : '#333'"
            :rail-color="theme ? '#3a3f50' : '#e8e8e8'"
            style="width: 64px; --n-font-size-circle: 13px;"
          >
            {{ qrCountdownText }}
          </n-progress>
        </div>
        <!-- WeChat Scan Hint -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#07c160">
            <path d="M8.5 13.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm5 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM12 2C6.477 2 2 6.037 2 11c0 2.757 1.438 5.228 3.693 6.85L5 20l2.85-1.424C8.827 18.93 10.377 19.5 12 19.5c5.523 0 10-4.037 10-8.5S17.523 2 12 2z"/>
          </svg>
          <p style="font-size: 13px;" :style="theme ? 'color: #888;' : 'color: #999;'">{{ t('scanLogin') }}</p>
        </div>
      </div>
    </div>
  </div>
</script>
<div id="app"></div>

<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;
const {
  NConfigProvider, NMessageProvider, NButton, NInput, NTabs, NTabPane,
  NIcon, NDivider, NText, NDialogProvider, NDropdown, NProgress, darkTheme,
  useMessage, useDialog
} = naive;

const themeRef = ref(null);

const app = createApp({
  setup() {
    const toggleTheme = () => {
      themeRef.value = themeRef.value === null ? darkTheme : null;
      document.body.classList.toggle('dark', themeRef.value !== null);
    };
    return { theme: themeRef, toggleTheme, darkTheme };
  },
  template: `
    <n-config-provider :theme="theme">
      <n-message-provider>
        <n-dialog-provider>
          <login-form @toggle-theme="toggleTheme" :theme="theme" :dark-theme="darkTheme" />
        </n-dialog-provider>
      </n-message-provider>
    </n-config-provider>
  `
});

const LoginForm = {
  props: ['theme', 'darkTheme'],
  emits: ['toggleTheme'],
  setup(props, { emit }) {
    const message = useMessage();
    const dialog = useDialog();
    const locale = ref('zh');
    const showLangMenu = ref(false);
    const langMenuX = ref(0);
    const langMenuY = ref(0);
    const i18n = reactive({ zh: {}, en: {} });

    const loadI18n = async () => {
      const [zhRes, enRes] = await Promise.all([
        fetch('i18n/zh.json').then(r => r.json()),
        fetch('i18n/en.json').then(r => r.json())
      ]);
      i18n.zh = zhRes;
      i18n.en = enRes;
    };
    loadI18n();

    const t = (key) => (i18n[locale.value] && i18n[locale.value][key]) || key;

    const langOptions = computed(() => [
      { label: i18n.zh.langZh || '简体中文', key: 'zh' },
      { label: i18n.en.langEn || 'English', key: 'en' }
    ]);

    const handleLangSelect = (key) => {
      locale.value = key;
      showLangMenu.value = false;
    };

    const handleLangClick = (e) => {
      langMenuX.value = e.clientX;
      langMenuY.value = e.clientY;
      showLangMenu.value = true;
    };

    const activeTab = ref('password');
    const phone = ref('');
    const verifyCode = ref('');
    const countdown = ref(0);
    const password = ref('');
    const showPassword = ref(false);
    const isSending = ref(false);
    const isLoggingIn = ref(false);
    const showQROverlay = ref(false);
    const qrCountdown = ref(300);
    const QR_TOTAL = 300;
    const percentage = ref(100);
    let qrTimer = null;

    const qrCountdownText = computed(() => {
      const mins = Math.floor(qrCountdown.value / 60);
      const secs = qrCountdown.value % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    });

    const generateQRCode = () => {
      const svg = document.getElementById('qrcode-svg');
      if (!svg) return;
      // 清除旧内容（保留第一个 rect 背景）
      const bg = svg.querySelector('rect');
      svg.innerHTML = '';
      svg.appendChild(bg);

      const size = 180;
      const modules = 25;
      const cellSize = size / modules;
      // 使用随机种子生成伪二维码图案
      const seed = Date.now();
      let rng = seed;
      const random = () => { rng = (rng * 16807 + 0) % 2147483647; return rng / 2147483647; };

      const rects = [];
      for (let row = 0; row < modules; row++) {
        for (let col = 0; col < modules; col++) {
          // 定位图案 - 三个角
          const isTopLeft = row < 7 && col < 7;
          const isTopRight = row < 7 && col >= modules - 7;
          const isBottomLeft = row >= modules - 7 && col < 7;

          if (isTopLeft || isTopRight || isBottomLeft) {
            const baseRow = isTopLeft ? 0 : isTopRight ? 0 : modules - 7;
            const baseCol = isTopLeft ? 0 : isTopRight ? modules - 7 : 0;
            const r = row - baseRow;
            const c = col - baseCol;
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              rects.push(`<rect x="${(col * cellSize).toFixed(1)}" y="${(row * cellSize).toFixed(1)}" width="${cellSize.toFixed(1)}" height="${cellSize.toFixed(1)}" fill="#1a1a1a"/>`);
            }
          } else if (random() > 0.5) {
            rects.push(`<rect x="${(col * cellSize).toFixed(1)}" y="${(row * cellSize).toFixed(1)}" width="${cellSize.toFixed(1)}" height="${cellSize.toFixed(1)}" fill="#1a1a1a"/>`);
          }
        }
      }
      svg.innerHTML += rects.join('');
    };

    const refreshQRCode = () => {
      qrCountdown.value = QR_TOTAL;
      percentage.value = 100;
      generateQRCode();
      if (qrTimer) clearInterval(qrTimer);
      qrTimer = setInterval(() => {
        qrCountdown.value--;
        percentage.value = Math.round(qrCountdown.value / QR_TOTAL * 100);
        if (qrCountdown.value <= 0) {
          percentage.value = 0;
          clearInterval(qrTimer);
          qrTimer = null;
          refreshQRCode();
        }
      }, 1000);
    };

    const handleLogin = () => {
      if (isLoggingIn.value) return;
      isLoggingIn.value = true;
      setTimeout(() => {
        isLoggingIn.value = false;
      }, 1500);

      if (activeTab.value === 'password') {
        if (!phone.value) {
          message.warning(t('phoneRequired'));
          return;
        }
        if (!/^1[3-9]\d{9}$/.test(phone.value)) {
          message.warning(t('phoneInvalid'));
          return;
        }
        if (!verifyCode.value) {
          message.warning(t('codeRequired'));
          return;
        }
        if (!password.value) {
          message.warning(t('passwordRequired'));
          return;
        }
      }
      message.success(t('loginSuccess'));
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    };

    const sendCode = () => {
      if (isSending.value) return;
      isSending.value = true;
      setTimeout(() => {
        isSending.value = false;
      }, 1500);

      if (!phone.value) {
        message.warning(t('phoneRequired'));
        return;
      }
      if (!/^1[3-9]\d{9}$/.test(phone.value)) {
        message.warning(t('phoneInvalid'));
        return;
      }
      countdown.value = 60;
      message.info(t('codeSent'));
      const timer = setInterval(() => {
        countdown.value--;
        if (countdown.value <= 0) clearInterval(timer);
      }, 1000);
    };

    onMounted(() => {
      generateQRCode();
      qrTimer = setInterval(() => {
        qrCountdown.value--;
        percentage.value = Math.round(qrCountdown.value / QR_TOTAL * 100);
        if (qrCountdown.value <= 0) {
          percentage.value = 0;
          clearInterval(qrTimer);
          qrTimer = null;
          refreshQRCode();
        }
      }, 1000);
    });

    onUnmounted(() => {
      if (qrTimer) clearInterval(qrTimer);
    });

    return {
      theme: props.theme, darkTheme: props.darkTheme,
      toggleTheme: () => emit('toggleTheme'),
      locale, t, i18n,
      langOptions, showLangMenu, langMenuX, langMenuY,
      handleLangClick, handleLangSelect,
      activeTab,
      phone, verifyCode, countdown,
      password, showPassword,
      isSending, isLoggingIn,
      handleLogin, sendCode,
      showQROverlay,
      qrCountdown, qrCountdownText, percentage,
      refreshQRCode, generateQRCode
    };
  },
  template: document.getElementById('login-template').innerHTML
};

app.component('n-config-provider', NConfigProvider);
app.component('n-message-provider', NMessageProvider);
app.component('n-dialog-provider', NDialogProvider);
app.component('login-form', LoginForm);
app.component('n-button', NButton);
app.component('n-input', NInput);
app.component('n-tabs', NTabs);
app.component('n-tab-pane', NTabPane);
app.component('n-icon', NIcon);
app.component('n-dropdown', NDropdown);
app.component('n-progress', NProgress);

app.mount('#app');
</script>
</body>
</html>
