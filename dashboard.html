<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Naive Admin</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui@2.44.1/dist/index.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.3s;
    }
    body.dark { color-scheme: dark; }
    body.dark .sidebar {
      background: #232736;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    body.dark .sidebar-header .logo-text { color: #e0e0e0; }
    body.dark .top-bar {
      background: #232736;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #e0e0e0;
    }
    body.dark .top-bar .action-btn { color: #e0e0e0; }
    body.dark .top-bar .action-btn:hover { background: rgba(255,255,255,0.08); }
    body.dark .tab-bar {
      background: #1a1c28;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    body.dark .tab-item { color: #888; }
    body.dark .tab-item:hover { background: #23252e; }
    body.dark .tab-item .close-icon:hover { background: rgba(255,255,255,0.1); }
    body.dark .tab-bar-actions .tab-action-btn { color: #ccc; }
    body.dark .tab-bar-actions .tab-action-btn:hover { background: rgba(255,255,255,0.08); }
    body.dark .tab-bar-actions {
      border-left-color: rgba(255,255,255,0.08);
      box-shadow: -2px 0 6px rgba(0,0,0,0.2);
    }
    body.dark .main-content {
      background: #1a1c28;
      color: #e0e0e0;
    }
    body.dark .main-wrapper { background: #0f1117; }
    body.dark .stat-card {
      background: #232736;
    }
    body.dark .stat-label { color: #999; }
    body.dark .stat-value { color: #e0e0e0; }
    body.dark .content-card {
      background: #232736;
    }
    body.dark .card-header {
      border-bottom-color: rgba(255,255,255,0.06);
    }
    body.dark .card-title { color: #e0e0e0; }
    body.dark .card-body { color: #ccc; }
    body.dark .activity-item { border-bottom-color: rgba(255,255,255,0.06); }
    body.dark .activity-name { color: #e0e0e0; }
    body.dark .activity-action { color: #999; }
    body.dark .activity-time { color: #888; }
    body.dark .activity-status { background: rgba(255,255,255,0.06) !important; color: #ccc !important; }
    body.dark .dept-table th { color: #ccc; }
    body.dark .dept-table td { color: #bbb; border-bottom-color: rgba(255,255,255,0.06); }
    body.dark .dept-badge {
      background: rgba(255,255,255,0.06) !important;
      color: #ccc !important;
    }
    body.dark .footer {
      color: #888;
      border-top-color: rgba(255,255,255,0.06);
    }
    body.dark .quick-link-label { color: #bbb; }

    /* 全局布局 */
    .dashboard-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      transition: all 0.3s;
    }

    /* 侧边栏 */
    .sidebar {
      width: 220px;
      min-width: 220px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: width 0.3s, min-width 0.3s, transform 0.3s;
      overflow: hidden;
      z-index: 100;
    }
    .sidebar.collapsed {
      width: 64px;
      min-width: 64px;
    }
    .sidebar.hidden {
      width: 0;
      min-width: 0;
      overflow: hidden;
    }
    .sidebar-header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header .logo-icon { flex-shrink: 0; }
    .sidebar-header .logo-text {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .sidebar.collapsed .logo-text { opacity: 0; width: 0; }
    .sidebar-menu { flex: 1; overflow-y: auto; overflow-x: hidden; }
    .sidebar-menu::-webkit-scrollbar { width: 4px; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 2px; }

    /* 侧边栏底部 */
    .sidebar-footer {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      border-top: 1px solid rgba(0,0,0,0.06);
      gap: 8px;
    }
    .sidebar-footer .sidebar-footer-text {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.3s;
    }
    .sidebar.collapsed .sidebar-footer-text { opacity: 0; width: 0; }
    .sidebar-footer .sidebar-footer-collapse {
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: #666;
      margin-left: auto;
      flex-shrink: 0;
    }
    .sidebar-footer .sidebar-footer-collapse:hover { background: rgba(128,128,128,0.1); }
    .sidebar-footer .sidebar-footer-collapse svg {
      transition: transform 0.2s;
    }
    .sidebar-footer .sidebar-footer-collapse:hover svg {
      transform: scale(1.2);
    }
    body.dark .sidebar-footer { border-top-color: rgba(255,255,255,0.06); }
    body.dark .sidebar-footer .sidebar-footer-text { color: #e0e0e0; }
    body.dark .sidebar-footer .sidebar-footer-collapse { color: #ccc; }
    body.dark .sidebar-footer .sidebar-footer-collapse:hover { background: rgba(255,255,255,0.08); }

    /* 主体区域 */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: #efefef;
    }
    .main-wrapper > .n-scrollbar-rail {
      display: none !important;
    }
    .main-wrapper > .n-scrollbar {
      flex: 1;
      overflow: hidden;
    }
    .main-wrapper .n-scrollbar-content {
      overflow: hidden;
    }

    /* 顶部操作栏 */
    .top-bar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      overflow: hidden;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 0 10px;
    }
    .top-bar .collapse-btn {
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .top-bar .collapse-btn:hover { background: rgba(128,128,128,0.1); }
    .top-bar .collapse-btn svg {
      transition: transform 0.2s;
    }
    .top-bar .collapse-btn:hover svg {
      transform: scale(1.2);
    }

    /* Header */
    .layout-header {
      flex-shrink: 0;
      margin: 0 12px;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
      background: #fff;
    }
    .breadcrumb-area { flex: 1; min-width: 0; }
    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .top-bar-actions .action-btn {
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      position: relative;
    }
    .top-bar-actions .action-btn:hover { background: rgba(128,128,128,0.1); }
    .top-bar-actions .lang-btn {
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s;
      font-size: 13px;
      font-weight: 500;
      color: inherit;
    }
    .top-bar-actions .lang-btn:hover { background: rgba(128,128,128,0.1); }
    body.dark .top-bar-actions .lang-btn:hover { background: rgba(255,255,255,0.08); }
    .top-bar-actions .action-btn svg {
      transition: transform 0.2s;
    }
    .top-bar-actions .action-btn:hover svg {
      transform: scale(1.2);
    }
    .top-bar-actions .action-btn .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 通知列表 */
    .notification-item {
      border-bottom: 1px solid rgba(128,128,128,0.06);
      cursor: pointer;
      transition: background 0.2s;
    }
    .notification-item:last-child { border-bottom: none; }
    .notification-item:hover { background: rgba(128,128,128,0.06); }
    body.dark .notification-item { border-bottom-color: rgba(255,255,255,0.06); }
    body.dark .notification-item:hover { background: rgba(255,255,255,0.06); }

    /* 通知更多操作按钮 */
    .notification-more-btn {
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      color: #999;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notification-more-btn:hover { background: rgba(128,128,128,0.15); color: #333; }
    body.dark .notification-more-btn { color: #888; }
    body.dark .notification-more-btn:hover { background: rgba(255,255,255,0.1); color: #ccc; }

    /* 用户卡片 */
    .user-card { padding: 0; }
    .user-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid rgba(128,128,128,0.1);
    }
    .user-card-info { display: flex; flex-direction: column; gap: 4px; }
    .user-card-name { font-size: 15px; font-weight: 600; }
    .user-card-phone { font-size: 12px; opacity: 0.5; }
    body.dark .user-card-phone { opacity: 0.4; }

    .user-card-menu { padding: 8px 0; }
    .user-card-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 0 8px;
      transition: background 0.2s;
    }
    .user-card-menu-item:hover { background: rgba(128,128,128,0.08); }
    body.dark .user-card-menu-item:hover { background: rgba(255,255,255,0.06); }

    .user-card-footer {
      border-top: 1px solid rgba(128,128,128,0.1);
      padding: 8px 0;
    }
    .user-card-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 0 8px;
      color: #e74c3c;
      transition: background 0.2s;
    }
    .user-card-logout:hover { background: rgba(231,76,60,0.08); }
    body.dark .user-card-logout { color: #ff6b6b; }
    body.dark .user-card-logout:hover { background: rgba(255,107,107,0.1); }

    /* Tab 栏 */
    .tab-bar {
      height: 48px;
      display: flex;
      align-items: flex-end;
      flex-shrink: 0;
      overflow: hidden;
      padding: 0 10px;
    }
    .n-tabs-nav-scroll-wrapper {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .n-tabs-nav-scroll-wrapper::-webkit-scrollbar { display: none; }
    .tab-item {
      height: 36px;
      padding: 11px 32px 11px 30px;
      margin: 3px -8px 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
      user-select: none;
      color: #666;
      background: transparent;
      -webkit-mask-box-image: url("data:image/svg+xml,%3Csvg width='67' height='33' viewBox='0 0 67 33' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M27 0c-6.627 0-12 5.373-12 12v6c0 8.284-6.716 15-15 15h67c-8.284 0-15-6.716-15-15v-6c0-6.627-5.373-12-12-12H27z' fill='black'/%3E%3C/svg%3E") 12 27 15;
    }
    .tab-item svg { width: 17px; height: 17px; transition: all 0.2s; }
    .tab-item:hover { background: #f0f0f0; }
    .tab-item.active {
      background: #e8f4ff;
      color: #1890ff;
      font-weight: 500;
      position: relative;
      -webkit-mask-box-image: url("data:image/svg+xml,%3Csvg width='67' height='33' viewBox='0 0 67 33' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M27 0c-6.627 0-12 5.373-12 12v6c0 8.284-6.716 15-15 15h67c-8.284 0-15-6.716-15-15v-6c0-6.627-5.373-12-12-12H27z' fill='black'/%3E%3C/svg%3E") 12 27 15;
    }
    body.dark .tab-item { color: #888; }
    body.dark .tab-item.active { background: rgba(30, 136, 229, 0.15); color: #4098fc;
      -webkit-mask-box-image: url("data:image/svg+xml,%3Csvg width='67' height='33' viewBox='0 0 67 33' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M27 0c-6.627 0-12 5.373-12 12v6c0 8.284-6.716 15-15 15h67c-8.284 0-15-6.716-15-15v-6c0-6.627-5.373-12-12-12H27z' fill='black'/%3E%3C/svg%3E") 12 27 15;
    }
    body.dark .tab-item svg { color: inherit; }
    .tab-item.active svg { width: 18px !important; height: 18px !important; }
    .tab-item .close-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      margin-left: 2px;
    }
    .tab-item:hover .close-icon { opacity: 0.5; }
    .tab-item .close-icon:hover { opacity: 1 !important; background: rgba(0,0,0,0.1); }
    body.dark .tab-item .close-icon:hover { background: rgba(255,255,255,0.1); }
    .tab-bar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
      flex-shrink: 0;
      padding-left: 8px;
      border-left: 1px solid rgba(128,128,128,0.1);
      box-shadow: -2px 0 6px rgba(0,0,0,0.04);
      padding: 5px 10px;
    }
    .tab-bar-actions .tab-action-btn {
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .tab-bar-actions .tab-action-btn:hover { background: rgba(128,128,128,0.1); }
    .tab-bar-actions .tab-action-btn svg {
      transition: transform 0.2s;
    }
    .tab-bar-actions .tab-action-btn:hover svg {
      transform: scale(1.2);
    }

    /* 主体内容 */
    .main-content {
      flex: 1;
      margin: 12px;
      background: #fff;
      border-radius: 8px;
    }

    /* 统计卡片 */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 10px;
    }
    .stat-card {
      border-radius: 8px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stat-info { flex: 1; min-width: 0; }
    .stat-label { font-size: 13px; margin-bottom: 8px; }
    .stat-value { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .stat-change { font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .stat-change.up { color: #18a058; }
    .stat-change.down { color: #e74c3c; }
    .stat-chart { width: 80px; height: 40px; flex-shrink: 0; }

    /* 内容行 */
    .content-row {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }
    .content-row.two-cols { grid-template-columns: 1fr 1fr; }
    .content-row.three-cols { grid-template-columns: 1fr 1fr 1fr; }
    .content-card {
      border-radius: 8px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(128,128,128,0.1);
    }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-body { padding: 16px 20px; }

    /* 柱状+折线图容器 */
    .chart-container { position: relative; width: 100%; height: 300px; }
    .chart-container canvas { width: 100% !important; height: 100% !important; }

    /* 用户动态列表 */
    .activity-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(128,128,128,0.06);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-right: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .activity-info { flex: 1; min-width: 0; }
    .activity-name { font-size: 14px; font-weight: 500; }
    .activity-action { font-size: 12px; margin-top: 2px; }
    .activity-status {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .activity-time { font-size: 12px; margin-left: 12px; flex-shrink: 0; min-width: 60px; text-align: right; }

    /* 部门表格 */
    .dept-table { width: 100%; border-collapse: collapse; }
    .dept-table th, .dept-table td {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid rgba(128,128,128,0.08);
    }
    .dept-table th { font-weight: 600; }
    .dept-badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* 快捷入口 */
    .quick-links {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 16px;
      padding: 10px 0;
    }
    .quick-link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 12px 4px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .quick-link-item:hover { background: rgba(128,128,128,0.06); }
    .quick-link-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quick-link-label { font-size: 12px; text-align: center; }

    /* 底部 */
    .footer {
      padding: 16px 20px;
      text-align: center;
      font-size: 12px;
      border-top: 1px solid rgba(128,128,128,0.08);
    }

    /* 全屏样式 */
    .main-content.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 16px;
      background: #fff;
    }
    .fullscreen-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10001;
      transition: all 0.2s;
      background: #2080f0;
      color: #fff;
      box-shadow: 0 2px 12px rgba(32,128,240,0.3);
    }
    .fullscreen-close:hover { background: #4098fc; box-shadow: 0 4px 16px rgba(32,128,240,0.4); }
    body.dark .fullscreen-close { box-shadow: 0 2px 12px rgba(32,128,240,0.4); }
    body.dark .fullscreen-close:hover { background: #4098fc; box-shadow: 0 4px 16px rgba(32,128,240,0.5); }

    /* 菜单折叠时图标居中 */
    .sidebar.collapsed .n-menu-item-content {
      justify-content: center !important;
    }
    .n-menu.n-menu--collapsed .n-menu-item-content .n-menu-item-content__arrow {
      opacity: 0;
      display: none;
    }

    /* 搜索模态框 */
    .search-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 15vh;
      backdrop-filter: blur(4px);
      animation: searchFadeIn 0.2s ease;
    }
    @keyframes searchFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .search-modal {
      width: 580px;
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.06);
      background: #fff;
      display: flex;
      flex-direction: column;
      animation: searchSlideIn 0.2s ease;
    }
    @keyframes searchSlideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    body.dark .search-modal {
      background: #232736;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .search-input-wrapper {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    body.dark .search-input-wrapper {
      border-bottom-color: rgba(255, 255, 255, 0.06);
    }
    .search-input-wrapper svg {
      color: #999;
      flex-shrink: 0;
    }
    .search-input-field {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: inherit;
    }
    body.dark .search-input-field { color: #e0e0e0; }
    .search-input-field::placeholder { color: #bbb; }
    body.dark .search-input-field::placeholder { color: #666; }
    .search-kbd-shortcut {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #999;
      flex-shrink: 0;
    }
    .search-kbd-shortcut kbd {
      padding: 2px 6px;
      border-radius: 4px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.4;
    }
    body.dark .search-kbd-shortcut kbd {
      background: #1a1c28;
      border-color: #333;
      color: #999;
    }
    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      max-height: 50vh;
    }
    .search-results::-webkit-scrollbar { width: 6px; }
    .search-results::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 3px; }
    .search-result-group {
      margin-bottom: 8px;
    }
    .search-result-group-label {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-result-item:hover,
    .search-result-item.active {
      background: #f0f5ff;
    }
    body.dark .search-result-item:hover,
    body.dark .search-result-item.active {
      background: rgba(30, 136, 229, 0.15);
    }
    .search-result-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      color: #666;
      flex-shrink: 0;
    }
    body.dark .search-result-item-icon {
      background: #1a1c28;
      color: #999;
    }
    .search-result-item-info {
      flex: 1;
      min-width: 0;
    }
    .search-result-item-label {
      font-size: 14px;
      font-weight: 500;
    }
    .search-result-item-label mark {
      background: #fff3cd;
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }
    body.dark .search-result-item-label mark {
      background: rgba(255, 243, 205, 0.2);
    }
    .search-result-item-path {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .search-result-item-arrow {
      color: #ccc;
      flex-shrink: 0;
    }
    .search-empty {
      padding: 40px 20px;
      text-align: center;
      color: #999;
    }
    .search-empty svg {
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .search-footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #999;
    }
    body.dark .search-footer {
      border-top-color: rgba(255, 255, 255, 0.06);
    }
    .search-footer-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .search-footer-item kbd {
      padding: 1px 5px;
      border-radius: 3px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 11px;
    }
    body.dark .search-footer-item kbd {
      background: #1a1c28;
      border-color: #333;
      color: #999;
    }

    /* 搜索按钮样式 */
    .search-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.06);
      transition: all 0.2s;
      min-width: 140px;
      gap: 12px;
    }
    .search-button:hover {
      background: rgba(255, 255, 255, 1);
      border-color: rgba(0, 0, 0, 0.1);
    }
    body.dark .search-button {
      background: rgba(35, 39, 54, 0.8);
      border-color: rgba(255, 255, 255, 0.06);
    }
    body.dark .search-button:hover {
      background: rgba(35, 39, 54, 1);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .search-button-content {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(194, 194, 194, 1);
    }
    .search-button-text {
      font-size: 14px;
      color: #767c82;
    }
    body.dark .search-button-text {
      color: #888;
    }
    .search-button-shortcut {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 14px;
      color: rgba(194, 194, 194, 1);
      opacity: 0.5;
    }
    .search-button-shortcut span {
      font-size: 12px;
      font-weight: 500;
    }
    body.dark .search-button-shortcut {
      color: #999;
    }
  </style>
</head>
<body>
<script type="text/html" id="dashboard-template">
  <div class="dashboard-layout">
        <!-- 左侧菜单 -->
        <div class="sidebar" :class="{ collapsed: collapsed, hidden: !sidebarVisible || layoutFullscreen }">
          <!-- Logo -->
          <div class="sidebar-header">
            <svg class="logo-icon" width="32" height="32" viewBox="0 0 32 32">
              <defs>
                <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#722ed1;stop-opacity:1" />
                </linearGradient>
              </defs>
              <rect width="32" height="32" rx="8" fill="url(#logoGrad1)"/>
              <path d="M8 10 L16 6 L24 10 L24 20 L16 26 L8 20 Z" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.9"/>
              <path d="M16 6 L16 26" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
              <path d="M8 10 L24 10" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
              <path d="M8 20 L24 20" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
              <circle cx="16" cy="16" r="3" fill="#fff" opacity="0.8"/>
            </svg>
            <span class="logo-text">后台管理系统</span>
          </div>
          <!-- 菜单 -->
          <div class="sidebar-menu">
            <n-menu
              v-model:value="menuValue"
              :options="menuOptions"
              :collapsed="collapsed"
              :collapsed-width="64"
              :collapsed-icon-size="20"
            />
          </div>
          <!-- 侧边栏底部 -->
          <div class="sidebar-footer" v-show="!layoutFullscreen">
            <span class="sidebar-footer-text">杭州网</span>
            <div class="sidebar-footer-collapse" @click="collapsed = !collapsed" :title="collapsed ? t('expandSidebar') : t('collapseSidebar')">
              <svg v-if="!collapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>
              </svg>
              <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- 主体 -->
        <div class="main-wrapper">
          <n-scrollbar>
          <header class="layout-header">
            <!-- 顶部操作栏 -->
            <div class="top-bar" v-show="!layoutFullscreen">
            <!-- 折叠按钮 -->
            <div class="collapse-btn" @click="sidebarVisible = !sidebarVisible" :title="sidebarVisible ? t('hideSidebar') : t('showSidebar')">
              <n-icon :size="20">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" v-if="sidebarVisible">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" v-else>
                  <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/>
                </svg>
              </n-icon>
            </div>

            <!-- 面包屑 -->
            <div class="breadcrumb-area">
              <n-breadcrumb separator="/">
                <n-breadcrumb-item>{{ t('home') }}</n-breadcrumb-item>
                <n-breadcrumb-item>分析页</n-breadcrumb-item>
                <n-breadcrumb-item>仪表盘</n-breadcrumb-item>
              </n-breadcrumb>
            </div>

            <!-- 操作按钮 -->
            <div class="top-bar-actions">
              <!-- 搜索按钮 -->
              <div class="search-button" @click="showSearch = true" :title="t('searchShortcut')">
                <div class="search-button-content">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="m21 21l-4.486-4.494M19 10.5a8.5 8.5 0 1 1-17 0a8.5 8.5 0 0 1 17 0Z"/>
                  </svg>
                  <span class="search-button-text">{{ t('search') }}</span>
                </div>
                <div class="search-button-shortcut">
                  <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M9 7V6H8V5H7v1h-.5v1H7v3.56a1.823 1.823 0 0 0 2.009 1.439L9 11a.9.9 0 0 1-.998-.495L8 7zm5-4h1v9h-1zm-1 3l-.085-.001c-.773 0-1.462.358-1.911.917L11 6.001h-1v6h1v-3a1.88 1.88 0 0 1 2.006-2l-.006-1zm-8.81 6C2.16 12 1 10.54 1 8s1.16-4 3.19-4h.029c.539 0 1.052.114 1.515.32l-.424.901a2.7 2.7 0 0 0-1.08-.22h-.042C2.38 5.001 2 6.631 2 8.001s.38 3 2.19 3c.497-.013.96-.145 1.366-.368l.444.898a3.94 3.94 0 0 1-1.806.47z"/>
                  </svg>
                  <span>k</span>
                </div>
              </div>

              <!-- 语言切换 -->
              <div class="lang-btn" @click="handleLangClick" :title="t('selectLanguage')">
                <n-icon :size="16">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                </n-icon>
                {{ locale === 'zh' ? t('langZh') : t('langEn') }}
              </div>
              <n-dropdown
                placement="bottom-end"
                :show="showLangMenu"
                :options="langOptions"
                :x="langMenuX"
                :y="langMenuY"
                @select="handleLangSelect"
                @clickoutside="showLangMenu = false"
              />

              <!-- 主题切换 -->
              <div class="action-btn" @click="toggleTheme" :title="theme === null ? t('toDark') : t('toLight')">
                <n-icon :size="18">
                  <svg v-if="theme === null" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                  </svg>
                  <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                </n-icon>
              </div>

              <!-- 全屏 -->
              <div class="action-btn" @click="toggleFullscreen" :title="isFullscreen ? t('exitFullscreen') : t('fullscreen')">
                <n-icon :size="18">
                  <svg v-if="!isFullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                  </svg>
                  <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                  </svg>
                </n-icon>
              </div>

              <!-- 消息通知 -->
              <n-popover trigger="click" placement="bottom-end" style="padding: 0; width: 320px;">
                <template #trigger>
                  <div class="action-btn" :title="t('notification')">
                    <n-icon :size="18">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                      </svg>
                    </n-icon>
                    <span class="badge">4</span>
                  </div>
                </template>
                <div style="padding: 0;">
                  <div style="font-weight: 600; font-size: 15px; padding: 12px 14px; border-bottom: 1px solid rgba(128,128,128,0.1); display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                      </svg>
                      {{ t('notification') }}
                    </div>
                    <n-dropdown :options="notificationActions" trigger="click" @select="handleNotificationAction" placement="bottom-end">
                      <div class="notification-more-btn" title="更多操作">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                        </svg>
                      </div>
                    </n-dropdown>
                  </div>
                  <div v-for="(msg, i) in notifications" :key="i" class="notification-item">
                    <div style="padding: 10px 14px;">
                      <div style="font-weight: 500; font-size: 13px;">{{ msg.title }}</div>
                      <div style="margin-top: 4px; font-size: 12px; opacity: 0.5;">{{ msg.time }}</div>
                    </div>
                  </div>
                </div>
              </n-popover>

              <!-- 用户下拉卡片 -->
              <n-popover trigger="hover" placement="bottom-end" style="padding: 0; width: 300px;">
                <template #trigger>
                  <div class="action-btn" style="display: flex; align-items: center; gap: 8px; padding: 4px 8px;">
                    <n-avatar :size="28" round style="background: #1890ff; color: #fff; font-size: 13px; font-weight: 600;">{{ t('admin').charAt(0) }}</n-avatar>
                    <div style="line-height: 1.2;">
                      <div style="font-size: 13px; font-weight: 500;">{{ t('admin') }}</div>
                      <div style="font-size: 11px; opacity: 0.6;">{{ t('superAdmin') }}</div>
                    </div>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0; opacity:0.5;">
                      <path d="M6 9l6 6 6-6"/>
                    </svg>
                  </div>
                </template>
                <div class="user-card">
                  <!-- 头部：用户信息 -->
                  <div class="user-card-header">
                    <n-avatar :size="48" round style="background: #1890ff; color: #fff; font-size: 20px; font-weight: 600;">{{ t('admin').charAt(0) }}</n-avatar>
                    <div class="user-card-info">
                      <div class="user-card-name">{{ t('admin') }}</div>
                      <n-tag size="small" type="success" round>{{ t('superAdmin') }}</n-tag>
                      <div class="user-card-phone">138****8000</div>
                    </div>
                  </div>
                  <!-- 中间：菜单 -->
                  <div class="user-card-menu">
                    <div class="user-card-menu-item" @click="handleUserAction('profile')">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                      </svg>
                      <span>{{ t('profile') }}</span>
                    </div>
                    <div class="user-card-menu-item" @click="handleUserAction('settings')">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                      </svg>
                      <span>{{ t('changePassword') }}</span>
                    </div>
                  </div>
                  <!-- 底部：退出登录 -->
                  <div class="user-card-footer">
                    <div class="user-card-logout" @click="handleUserAction('logout')">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                      </svg>
                      <span>{{ t('logout') }}</span>
                    </div>
                  </div>
                </div>
              </n-popover>
            </div>
          </div>

          <!-- Tab 栏 -->
          <div class="tab-bar">
            <div class="n-tabs-nav-scroll-wrapper" ref="scrollContainer">
              <div
                v-for="tab in tabs"
                :key="tab.key"
                class="tab-item"
                :class="{ active: activeTab === tab.key }"
                :data-tab-key="tab.key"
                @click="activeTab = tab.key; scrollToTab(tab.key)"
              >
                <span v-html="tab.icon" style="display: flex; align-items: center;"></span>
                <span>{{ tab.label }}</span>
                <span class="close-icon" v-if="tabs.length > 1 && tab.key !== 'dashboard'" @click.stop="closeTab(tab.key)">
                  <n-icon :size="12">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </n-icon>
                </span>
              </div>
            </div>
            <!-- Tab 操作按钮 -->
            <div class="tab-bar-actions">
              <n-dropdown :options="getTabActionOptions()" trigger="click" @select="handleTabAction">
                <div class="tab-action-btn">
                  <n-icon :size="16">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                      <path d="M8 6a2 2 0 1 1-4 0a2 2 0 0 1 4 0m0 6a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4m8-14a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4m2 4a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4-10a2 2 0 1 0 0-4a2 2 0 0 0 0 4m2 4a2 2 0 1 1-4 0a2 2 0 0 1 4 0m-2 8a2 2 0 1 0 0-4a2 2 0 0 0 0 4"/>
                    </svg>
                  </n-icon>
                </div>
              </n-dropdown>
              <div class="tab-action-btn" @click="toggleLayoutFullscreen" :title="t('fullscreen')">
                <n-icon :size="16">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" v-if="!layoutFullscreen">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                  </svg>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" v-else>
                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                  </svg>
                </n-icon>
              </div>
              <div class="tab-action-btn" @click="refreshContent" :title="t('refresh')">
                <n-icon :size="16">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                  </svg>

      if (!searchQuery.value.trim()) return [];
      const q = searchQuery.value.toLowerCase().trim();

        item.label.toLowerCase().includes(q) ||
        item.path.toLowerCase().includes(q) ||
        item.key.toLowerCase().includes(q)
      );
    });

    const groupedResults = computed(() => {
      const groups = {};
      filteredResults.value.forEach(item => {
        const groupLabel = item.path.split(' / ')[0];
        if (!groups[groupLabel]) groups[groupLabel] = [];
        groups[groupLabel].push(item);
      });
      return Object.entries(groups).map(([label, items]) => ({ label, items }));
    });

      }

      let targetEl = null;
      let targetIdx = -1;
      items.forEach((item, i) => {
        if (item.getAttribute('data-tab-key') === tabKey) {
          targetEl = item;
          targetIdx = i;
        }
      });
      if (!targetEl) return;

      const containerWidth = container.clientWidth;
      const actionAreaWidth = 120;
      const safeRight = containerWidth - actionAreaWidth;

      const containerRect = container.getBoundingClientRect();
      const itemRect = targetEl.getBoundingClientRect();
      const curScroll = container.scrollLeft;
      // 计算元素在滚动容器中的绝对位置
      const itemAbsLeft = itemRect.left - containerRect.left + curScroll;
      const itemAbsRight = itemAbsLeft + itemRect.width;

      if (itemAbsRight > curScroll + safeRight) {
        // 右侧被操作按钮遮挡，向左滚动
        container.scrollTo({ left: itemAbsRight - safeRight, behavior: 'smooth' });
      } else if (itemAbsLeft < curScroll + 200) {

    // 绘制迷你图
    function drawSparkline(canvasId, data, color) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const max = Math.max(...data);
      const min = Math.min(...data);
      const range = max - min || 1;

      ctx.clearRect(0, 0, w, h);
      ctx.beginPath();
      data.forEach((v, i) => {
        const x = (i / (data.length - 1)) * w;
        const y = h - ((v - min) / range) * (h - 4) - 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 填充
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fillStyle = color + '15';
      ctx.fill();
    }

    // 绘制主图表（柱状+折线混合）
    function drawMainChart() {
      const canvas = document.getElementById('mainChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2, 2);
      const w = rect.width;
      const h = rect.height;

      const isDarkLocal = isDark.value;
      const textColor = isDarkLocal ? '#999' : '#666';
      const gridColor = isDarkLocal ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';

      const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      const barData1 = [32, 45, 38, 52, 48, 65, 58, 72, 60, 78, 65, 82];
      const barData2 = [25, 35, 30, 42, 38, 50, 45, 58, 48, 62, 52, 68];
      const lineData = [52, 60, 55, 65, 62, 72, 68, 78, 70, 82, 75, 88];

      const padding = { top: 20, right: 20, bottom: 40, left: 50 };
      const chartW = w - padding.left - padding.right;
      const chartH = h - padding.top - padding.bottom;
      const barGroupW = chartW / months.length;
      const barW = barGroupW * 0.25;
      const maxVal = 100;

      ctx.clearRect(0, 0, w, h);

      // 网格线
      for (let i = 0; i <= 5; i++) {
        const y = padding.top + (chartH / 5) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(w - padding.right, y);
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.stroke();

        // Y 轴标签
        const val = maxVal - (maxVal / 5) * i;
        ctx.fillStyle = textColor;
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(val + '%', padding.left - 8, y + 4);
      }

      // X 轴标签
      months.forEach((m, i) => {
        const x = padding.left + barGroupW * i + barGroupW / 2;
        ctx.fillStyle = textColor;
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(m, x, h - 10);
      });

      // 柱状图
      months.forEach((m, i) => {
        const x = padding.left + barGroupW * i + barGroupW * 0.15;
        const y1 = padding.top + chartH - (barData1[i] / maxVal) * chartH;
        const y2 = padding.top + chartH - (barData2[i] / maxVal) * chartH;

        // 柱1
        const grad1 = ctx.createLinearGradient(x, y1, x, padding.top + chartH);
        grad1.addColorStop(0, '#1890ff');
        grad1.addColorStop(1, '#1890ff88');
        ctx.fillStyle = grad1;
        ctx.beginPath();
        const r = 3;
        ctx.moveTo(x + r, y1);
        ctx.lineTo(x + barW - r, y1);
        ctx.quadraticCurveTo(x + barW, y1, x + barW, y1 + r);
        ctx.lineTo(x + barW, padding.top + chartH);
        ctx.lineTo(x, padding.top + chartH);
        ctx.lineTo(x, y1 + r);
        ctx.quadraticCurveTo(x, y1, x + r, y1);
        ctx.fill();

        // 柱2
        const x2 = x + barW + 2;
        const grad2 = ctx.createLinearGradient(x2, y2, x2, padding.top + chartH);
        grad2.addColorStop(0, '#18a058');
        grad2.addColorStop(1, '#18a05888');
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.moveTo(x2 + r, y2);
        ctx.lineTo(x2 + barW - r, y2);
        ctx.quadraticCurveTo(x2 + barW, y2, x2 + barW, y2 + r);
        ctx.lineTo(x2 + barW, padding.top + chartH);
        ctx.lineTo(x2, padding.top + chartH);
        ctx.lineTo(x2, y2 + r);
        ctx.quadraticCurveTo(x2, y2, x2 + r, y2);
        ctx.fill();
      });

      // 折线图
      ctx.beginPath();
      lineData.forEach((v, i) => {
        const x = padding.left + barGroupW * i + barGroupW / 2;
        const y = padding.top + chartH - (v / maxVal) * chartH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 折线填充区域
      ctx.beginPath();
      lineData.forEach((v, i) => {
        const x = padding.left + barGroupW * i + barGroupW / 2;
        const y = padding.top + chartH - (v / maxVal) * chartH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.lineTo(padding.left + barGroupW * (lineData.length - 1) + barGroupW / 2, padding.top + chartH);
      ctx.lineTo(padding.left + barGroupW / 2, padding.top + chartH);
      ctx.closePath();
      const lineGrad = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartH);
      lineGrad.addColorStop(0, 'rgba(255, 136, 0, 0.2)');
      lineGrad.addColorStop(1, 'rgba(255, 136, 0, 0)');
      ctx.fillStyle = lineGrad;
      ctx.fill();

      // 折线点
      lineData.forEach((v, i) => {
        const x = padding.left + barGroupW * i + barGroupW / 2;
        const y = padding.top + chartH - (v / maxVal) * chartH;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ff8800';
        ctx.fill();
        ctx.strokeStyle = isDark ? '#232736' : '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function drawCharts() {
      nextTick(() => {
        // 迷你图
        stats.forEach((s, i) => {
          const colors = ['#1890ff', '#18a058', '#ff8800', '#e74c3c'];
          drawSparkline('sparkline' + i, s.sparkData, colors[i]);
        });
        drawMainChart();
      });
    }

    // 监听主题变化重绘图表
    watch(isDark, () => {
      drawCharts();
    });

    // 窗口大小变化时重绘
    let resizeTimer;
    const handleResize = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(drawCharts, 100);
    };

    onMounted(() => {
      drawCharts();
      window.addEventListener('resize', handleResize);
      // 键盘快捷键：Ctrl+K 打开搜索
      window.addEventListener('keydown', handleKeyDown);
    });

    onUnmounted(() => {
      window.removeEventListener('resize', handleResize);
      clearTimeout(resizeTimer);
      window.removeEventListener('keydown', handleKeyDown);
    });

    // 键盘事件处理
    const handleKeyDown = (e) => {
      // Ctrl+K 或 Cmd+K 打开搜索
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        showSearch.value = true;
        nextTick(() => {
          searchInputRef.value?.focus();
        });
        return;
      }
      // ESC 关闭搜索
      if (e.key === 'Escape' && showSearch.value) {
        showSearch.value = false;
        searchQuery.value = '';
        return;
      }
      // 搜索框打开时的上下导航
      if (showSearch.value && filteredResults.value.length > 0) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeSearchIndex.value = (activeSearchIndex.value + 1) % filteredResults.value.length;
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeSearchIndex.value = (activeSearchIndex.value - 1 + filteredResults.value.length) % filteredResults.value.length;
        } else if (e.key === 'Enter' && filteredResults.value[activeSearchIndex.value]) {
          e.preventDefault();
          navigateTo(filteredResults.value[activeSearchIndex.value]);
        }
      }
    };

    // 监听搜索框显示，自动聚焦
    watch(showSearch, (val) => {
      if (val) {
        nextTick(() => {
          searchInputRef.value?.focus();
        });
      }
    });

    // 添加快捷入口
    function addQuickLink() {
      message.info(t('addShortcut'));
    }

    // 全屏状态监听
    document.addEventListener('fullscreenchange', () => {
      isFullscreen.value = !!document.fullscreenElement;
    });

    return {
      theme: props.theme, darkTheme: props.darkTheme, toggleTheme,
      locale, t, i18n,
      langOptions, showLangMenu, langMenuX, langMenuY,
      handleLangClick, handleLangSelect,
      collapsed, sidebarVisible, layoutFullscreen, menuValue, menuOptions,
      activeTab, scrollContainer, scrollToTab, tabs, getTabActionOptions, handleTabAction, closeTab,
      contentFullscreen, isFullscreen,
      toggleFullscreen, toggleContentFullscreen, toggleLayoutFullscreen, refreshContent,
      handleUserAction,
      notificationActions, handleNotificationAction,
      notifications, stats, activities, departments, quickLinks, addQuickLink,
      drawCharts,
      // 搜索
      showSearch, searchQuery, searchInputRef, activeSearchIndex,
      filteredResults, groupedResults, getGlobalIndex, highlightText,
      onSearchInput, navigateTo
    };
  },
  template: document.getElementById('dashboard-template').innerHTML
};

// 手动注册组件
app.component('n-config-provider', NConfigProvider);
app.component('n-message-provider', NMessageProvider);
app.component('n-dialog-provider', NDialogProvider);
app.component('dashboard-content', DashboardContent);
app.component('n-input', NInput);
app.component('n-icon', NIcon);
app.component('n-menu', NMenu);
app.component('n-breadcrumb', NBreadcrumb);
app.component('n-breadcrumb-item', NBreadcrumbItem);
app.component('n-avatar', NAvatar);
app.component('n-popover', NPopover);
app.component('n-dropdown', NDropdown);
app.component('n-tag', NTag);
app.component('n-scrollbar', NScrollbar);

app.mount('#app');
</script>
</body>
